mode = "embedded" # embedded | server | client

[s3]
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
bucket = "lightfs"
access_key = "minioadmin"
secret_key = "minioadmin"
path_style = true

[metadata]
path = "./data/lightfs.db"

[server]
bind = "127.0.0.1:8080"

[cache.metadata]
enabled = true
ttl_seconds = 5

[cache.data]
enabled = false
max_size_bytes = 10737418240
max_age_seconds = 3600

# Superseded-object retention: replaced/deleted committed objects stay in
# the bucket this long, so `lightfs backup` snapshots can restore
# point-in-time CONTENT (not just names). `lightfs gc` purges objects whose
# window has passed. 0 = delete immediately (backups become metadata-only).
[retention]
superseded_secs = 604800

# Canonical backup root (P0-b). `lightfs backup` publishes one directory per
# backup here: meta.db snapshot + versioned object manifest + backup.json,
# atomically renamed into place. `lightfs gc` REFUSES to delete objects
# unless this is configured — every valid, unexpired manifest in the root
# protects its listed keys. Corrupt/unknown backups in the root fail the
# whole gc (fail-closed); resolve with `lightfs backup prune --id ID`.
# Backups live forever unless --expires-in is given at creation.
#
# FIRST-TIME ENABLEMENT: configuring a root does NOT auto-protect old
# backups kept OUTSIDE the root (e.g. legacy single-file `lightfs backup
# OUT.db` snapshots). Inventory every historical backup and retire,
# re-publish under this root, or remove it — before letting gc run. gc
# itself verifies every manifest in the root first and refuses to delete
# anything if any backup is unverifiable.
[backup]
# root = "/var/lib/lightfs/backups"
# How long gc waits for the inter-process maintenance lock (gc.lock) before
# giving up. A crashed holder releases it automatically (OS-level flock).
lock_timeout_secs = 600
