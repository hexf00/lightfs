# PR-required checks for LightFS. This workflow is the CI counterpart of
# scripts/ci.sh (runnable locally with no arguments). Required for merge:
# unit tests, dependency gate, MinIO integration tests.
#
# NOT in this workflow (separate release gates):
# - Linux FUSE semantic acceptance (requires a runner with /dev/fuse)
# - real-OSS external acceptance (requires isolated test credentials)
#
# perf-smoke is a NON-gating trend probe: shared 2-core runners are noisy,
# numbers are for catching order-of-magnitude regressions only.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # S4.17.1: repeatable candidate verification WITHOUT merging the
  # experimental branch to main — dispatch this workflow on any ref
  # (e.g. the release-candidate branch) to run the full Linux gate
  # (tests + MinIO contract + perf-smoke with artifact) on that exact
  # commit.
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain version is pinned by rust-toolchain.toml (1.85.1);
      # it is the required baseline. Latest-stable checks are an extra,
      # non-blocking job and never replace this baseline.
      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Restore pinned MinIO (cache)
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: /tmp/minio
          key: minio-RELEASE.2025-10-15T17-29-55Z-linux-amd64-v2

      - name: Check out pinned MinIO source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: RELEASE.2025-10-15T17-29-55Z
          path: minio-src

      - name: Install Go (MinIO build)
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build pinned MinIO from source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          # dl.min.io no longer serves binaries (410 since the 2025
          # licensing change) and anonymous Docker Hub pulls are
          # rate-limited on shared runners. Building the pinned tag from
          # source is deterministic; main package is at the repo ROOT.
          cd minio-src
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/minio .

      - name: Start MinIO (pinned version)
        run: |
          mkdir -p /tmp/minio-data
          /tmp/minio server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 150); do
            curl -sf -m 1 -o /dev/null http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 0.2
          done
          cat /tmp/minio.log >&2 || true
          echo "MinIO did not become healthy" >&2
          exit 1

      - name: Formatting + lints
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      # MinIO integration tests are REQUIRED: LIGHTFS_TEST_MINIO=1 must be
      # set in this job, otherwise the integration tests self-skip and the
      # job would pass without exercising the S3 backend.
      - name: Unit + integration tests (no silent skips)
        env:
          LIGHTFS_TEST_MINIO: "1"
          LIGHTFS_S3_ENDPOINT: http://127.0.0.1:9000
          LIGHTFS_S3_BUCKET: lightfs-test
        run: bash scripts/ci.sh

  perf-smoke:
    # Small-dataset benchmark against MinIO + a real server on the runner.
    # NON-GATING: hosted runners are shared 2-core VMs; absolute numbers are
    # noisy. This exists to catch ORDER-OF-MAGNITUDE regressions between
    # runs and to keep a machine-readable history in artifacts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Restore pinned MinIO (cache)
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: /tmp/minio
          key: minio-RELEASE.2025-10-15T17-29-55Z-linux-amd64-v2

      - name: Check out pinned MinIO source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: RELEASE.2025-10-15T17-29-55Z
          path: minio-src

      - name: Install Go (MinIO build)
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build pinned MinIO from source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          cd minio-src
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/minio .

      - name: Build lightfs (release)
        run: cargo build --release --bin lightfs --bin lightfs-shell --bin lightfs-bench

      - name: Start MinIO
        run: |
          mkdir -p /tmp/minio-data
          /tmp/minio server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 150); do
            curl -sf -m 1 -o /dev/null http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 0.2
          done
          cat /tmp/minio.log >&2 || true
          echo "MinIO did not become healthy" >&2
          exit 1

      - name: Run perf smoke (small dataset)
        shell: bash
        run: |
          set -euo pipefail
          PORT=18085
          DB=/tmp/perf-smoke-$$.db
          cat > /tmp/perf-smoke.toml <<CFG
          mode = "server"
          [s3]
          endpoint = "http://127.0.0.1:9000"
          region = "us-east-1"
          bucket = "lightfs-perf-smoke"
          access_key = "minioadmin"
          secret_key = "minioadmin"
          path_style = true
          [metadata]
          path = "$DB"
          [server]
          bind = "127.0.0.1:$PORT"
          [cache.metadata]
          enabled = false
          [cache.data]
          enabled = false
          CFG
          ./target/release/lightfs create-bucket --config /tmp/perf-smoke.toml
          ./target/release/lightfs server --config /tmp/perf-smoke.toml > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 100); do
            curl -sf -m 1 -o /dev/null http://127.0.0.1:$PORT/health && break
            sleep 0.2
          done
          {
            echo "# perf-smoke ($(date -u +%FT%TZ), ubuntu-latest, shared 2-core runner — noisy)"
            echo "# dataset: 200 x 100KB + 32MB large + stream-write + 4KiB reads + meta lookups"
            ./target/release/lightfs-bench \
              --server "http://127.0.0.1:$PORT" \
              --s3-endpoint http://127.0.0.1:9000 \
              --bucket lightfs-perf-smoke \
              --objects 200 --obj-size 102400 \
              --large-mb 32 --lfs-large-mb 32 \
              --scenario "prepare,raw-serial,raw-par8,lfs-serial,lfs-par8,lfs-large,lfs-stream-write,lfs-4k-rand,lfs-meta" \
              2>&1
          } | tee perf-smoke.txt
          kill $SERVER_PID 2>/dev/null || true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## perf-smoke"
            echo '```'
            cat perf-smoke.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke
          path: perf-smoke.txt
          retention-days: 30

  macos-arm64:
    # S4.17.1 — macOS ARM64 experimental-release gate (moved into this
    # registered workflow: GitHub only dispatches workflows that exist on
    # the default branch, so a branch-only workflow file cannot be a
    # dispatch target). Builds the release CLI/server/bench binaries on
    # Apple Silicon and runs the network-free library suite. Scope stated
    # honestly: NO macOS mount claim — LightFS has no macOS mount adapter
    # (fuse.rs is Linux-gated; the Windows adapter is WinFsp); macOS usage
    # is server + RPC (shell/bench).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Build release binaries
        run: cargo build --release --bin lightfs --bin lightfs-shell --bin lightfs-bench

      - name: Library suite (network-free)
        run: cargo test --lib

      - name: Smoke — binaries start; dead-endpoint path fails loudly
        run: |
          set -euo pipefail
          ./target/release/lightfs version
          cat > /tmp/smoke.toml <<'CFG'
          [s3]
          endpoint = "http://127.0.0.1:1"
          region = "us-east-1"
          bucket = "smoke"
          access_key = "minioadmin"
          secret_key = "minioadmin"
          path_style = true
          [metadata]
          path = "/tmp/smoke-meta.db"
          CFG
          if ./target/release/lightfs create-bucket --config /tmp/smoke.toml; then
            echo "create-bucket against a dead endpoint must fail" >&2
            exit 1
          fi
          echo "smoke: binaries start; dead-endpoint path fails loudly"

      - name: Upload binaries (macOS ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: lightfs-darwin-arm64-${{ github.sha }}
          path: |
            target/release/lightfs
            target/release/lightfs-shell
            target/release/lightfs-bench
          retention-days: 30

