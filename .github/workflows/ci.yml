# PR-required checks for LightFS. This workflow is the CI counterpart of
# scripts/ci.sh (runnable locally with no arguments). Required for merge:
# unit tests, dependency gate, MinIO integration tests.
#
# NOT in this workflow (separate release gates):
# - Linux FUSE semantic acceptance (requires a runner with /dev/fuse)
# - real-OSS external acceptance (requires isolated test credentials)
# - performance/soak runs (manual: scripts/perf-*.sh)
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain version is pinned by rust-toolchain.toml (1.85.1);
      # it is the required baseline. Latest-stable checks are an extra,
      # non-blocking job and never replace this baseline.
      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Start MinIO (pinned version)
        run: |
          TAG=RELEASE.2025-10-15T17-29-55Z
          # Anonymous Docker Hub pulls are rate-limited on shared runners;
          # fall back to MinIO's public ECR mirror, and print the pull error
          # so a registry problem is visible in the step log itself.
          docker pull minio/minio:$TAG || docker pull public.ecr.aws/minio/minio:$TAG
          REF=minio/minio:$TAG
          docker image inspect minio/minio:$TAG >/dev/null 2>&1 || REF=public.ecr.aws/minio/minio:$TAG
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            $REF server /data
          for i in $(seq 1 150); do
            curl -sf -m 1 -o /dev/null http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 0.2
          done
          docker logs minio >&2 || true
          echo "MinIO did not become healthy" >&2
          exit 1

      - name: Formatting + lints
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      # MinIO integration tests are REQUIRED: LIGHTFS_TEST_MINIO=1 must be
      # set in this job, otherwise the integration tests self-skip and the
      # job would pass without exercising the S3 backend.
      - name: Unit + integration tests (no silent skips)
        env:
          LIGHTFS_TEST_MINIO: "1"
          LIGHTFS_S3_ENDPOINT: http://127.0.0.1:9000
          LIGHTFS_S3_BUCKET: lightfs-test
        run: bash scripts/ci.sh
