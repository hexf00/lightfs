# Release-blocking gates that CANNOT run in the standard CI environment.
# These must pass before LightFS touches real user data:
#   1. Linux FUSE semantic acceptance (requires a runner with /dev/fuse)
#   2. Real-OSS external acceptance (requires isolated test credentials)
# Both jobs fail loudly while their prerequisites are missing - an absent
# gate is NEVER reported as passed.
name: release-gates

on:
  workflow_dispatch: {}   # release manager triggers this on the release commit

jobs:
  fuse-acceptance:
    runs-on: [self-hosted, linux, fuse]
    steps:
      - uses: actions/checkout@v4
      - name: Preflight
        run: |
          if [[ ! -e /dev/fuse ]]; then
            echo "FAIL: no /dev/fuse on this runner - FUSE semantics NOT verified"
            exit 1
          fi
      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      # Build FROM THE CHECKED-OUT COMMIT: the gate verifies the hash of
      # these exact binaries before testing - no stale target/ artifacts.
      - name: Build release binaries
        run: cargo build --release --bin lightfs --bin lightfs-shell
      - name: Compute deployment hash
        run: |
          SHA=$(sha256sum target/release/lightfs | awk '{print $1}')
          echo "EXPECTED_LIGHTFS_SHA=$SHA" >> "$GITHUB_ENV"
          echo "built lightfs sha256: $SHA"

      - name: Restore pinned MinIO (cache)
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: /tmp/minio
          key: minio-RELEASE.2025-10-15T17-29-55Z-linux-amd64-v2

      - name: Check out pinned MinIO source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: RELEASE.2025-10-15T17-29-55Z
          path: minio-src

      - name: Install Go (MinIO build)
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build pinned MinIO from source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          # dl.min.io no longer serves binaries (410 since the 2025
          # licensing change) and anonymous Docker Hub pulls are
          # rate-limited on shared runners. Building the pinned tag from
          # source is deterministic; main package is at the repo ROOT.
          cd minio-src
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/minio .

      - name: Start MinIO (pinned version)
        run: |
          mkdir -p /tmp/minio-data
          /tmp/minio server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 150); do
            curl -sf -m 1 -o /dev/null http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 0.2
          done
          cat /tmp/minio.log >&2 || true
          echo "MinIO did not become healthy" >&2
          exit 1

      # THE ACTUAL GATE: deploy the freshly built binaries to the location
      # the gate script hash-verifies, then run every FUSE regression
      # scenario (R1-R10) against this exact commit's build.
      - name: Deploy binaries + run fuse-gate.sh
        env:
          GATE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p /tmp/lightfs-accept
          cp target/release/lightfs target/release/lightfs-shell /tmp/lightfs-accept/
          chmod +x /tmp/lightfs-accept/lightfs /tmp/lightfs-accept/lightfs-shell
          EXPECTED_LIGHTFS_SHA="$EXPECTED_LIGHTFS_SHA" \
            bash scripts/fuse-gate.sh ci
      - name: Cleanup
        if: always()
        run: |
          # only OUR gate's processes (it records PIDs in split files)
          [[ -f /tmp/lightfs-gate.pids.lightfs ]] && \
            while read -r p; do kill "$p" 2>/dev/null || true; done < /tmp/lightfs-gate.pids.lightfs
          pkill -x minio || true

  oss-acceptance:
    runs-on: ubuntu-latest
    environment: oss-test-credentials   # secrets configured there, scoped to a TEST bucket
    steps:
      - uses: actions/checkout@v4
      - name: Preflight (credentials must be present; default is explicit PENDING)
        env:
          ENDPOINT: ${{ secrets.OSS_TEST_ENDPOINT }}
          ACCESS_KEY: ${{ secrets.OSS_TEST_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.OSS_TEST_SECRET_KEY }}
          BUCKET: ${{ secrets.OSS_TEST_BUCKET }}
        run: |
          if [[ -z "$ENDPOINT" || -z "$ACCESS_KEY" || -z "$SECRET_KEY" || -z "$BUCKET" ]]; then
            echo "PENDING: real-OSS acceptance not executed - credentials not configured."
            echo "This gate stays red until the external acceptance has actually run."
            exit 1
          fi
          # sanitized target info only; never print credentials
          echo "target: $ENDPOINT bucket: $BUCKET"
      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: External acceptance
        env:
          ENDPOINT: ${{ secrets.OSS_TEST_ENDPOINT }}
          ACCESS_KEY: ${{ secrets.OSS_TEST_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.OSS_TEST_SECRET_KEY }}
          BUCKET: ${{ secrets.OSS_TEST_BUCKET }}
        run: |
          LIGHTFS_OSS_ENDPOINT="$ENDPOINT" \
          LIGHTFS_OSS_ACCESS_KEY="$ACCESS_KEY" \
          LIGHTFS_OSS_SECRET_KEY="$SECRET_KEY" \
          LIGHTFS_OSS_BUCKET="$BUCKET" \
          LIGHTFS_OSS_PREFIX="ci-$(date +%s)/" \
          bash scripts/oss-acceptance.sh
