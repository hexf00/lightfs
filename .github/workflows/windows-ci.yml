# Windows CI: build portable executables on windows-latest, then run a REAL
# mount smoke test through WinFsp (rclone-style: the hosted runner installs
# the WinFsp driver and mounts a drive letter).
#
# Product note (2026-10): the core is one platform-independent codebase; the
# mount layer is OS-specific (Linux FUSE / WinFsp adapter).
name: windows-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Build release binaries
        run: cargo build --release --bin lightfs --bin lightfs-shell --bin lightfs-bench

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: lightfs-windows-x64
          path: |
            target/release/lightfs.exe
            target/release/lightfs-shell.exe
          retention-days: 7

  mount-smoke:
    # Real end-to-end validation of the WinFsp adapter on a hosted runner:
    # install WinFsp, run MinIO + lightfs server, mount the filesystem as
    # drive Q:, exercise file operations THROUGH the drive letter, then kill
    # the mount process and verify the drive disappears.
    runs-on: windows-latest
    needs: windows
    env:
      WINFSP_BIN: 'C:\Program Files (x86)\WinFsp\bin'
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: lightfs-windows-x64
          path: bin

      - name: Install WinFsp (driver + FUSE-compat DLL)
        run: choco install winfsp -y --no-progress

      - name: Restore pinned MinIO (cache)
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: |
            minio-src
            minio.exe
          key: minio-RELEASE.2025-10-15T17-29-55Z-windows-amd64-v1

      - name: Check out pinned MinIO source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: RELEASE.2025-10-15T17-29-55Z
          path: minio-src

      - name: Install Go (MinIO build)
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build pinned MinIO from source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:GOOS='windows'
          cd minio-src
          go build -trimpath -ldflags "-s -w" -o ..\minio.exe .

      - name: "WinFsp mount smoke (single step: servers must outlive step-local process cleanup)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path += ";$env:WINFSP_BIN"
          $procs = @()
          function Wait-Url($url, $tries, $what) {
            $ok = $false
            foreach ($i in 1..$tries) {
              try {
                Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 $url | Out-Null
                $ok = $true; break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw "$what did not become healthy" }
          }

          try {
            # ---- [1] MinIO on :9000 ----
            New-Item -ItemType Directory -Force D:\minio-data | Out-Null
            $p = Start-Process -FilePath .\minio.exe `
              -ArgumentList 'server','D:\minio-data','--address',':9000' `
              -PassThru -RedirectStandardError minio.err -RedirectStandardOutput minio.out
            $procs += $p
            Wait-Url 'http://127.0.0.1:9000/minio/health/live' 60 'MinIO'

            # ---- [2] lightfs server on :18085 (server mode, S3 = MinIO) ----
            @"
          mode = "server"
          [s3]
          endpoint = "http://127.0.0.1:9000"
          region = "us-east-1"
          bucket = "lightfs-smoke"
          access_key = "minioadmin"
          secret_key = "minioadmin"
          path_style = true
          [metadata]
          path = "C:/lightfs-smoke/metadata.db"
          [server]
          bind = "127.0.0.1:18085"
          [cache.metadata]
          enabled = false
          [cache.data]
          enabled = false
          "@ | Set-Content -Encoding ascii cfg.toml
            .\bin\lightfs.exe create-bucket --config cfg.toml
            $p = Start-Process -FilePath .\bin\lightfs.exe `
              -ArgumentList 'server','--config',"$PWD\cfg.toml" `
              -PassThru -RedirectStandardError server.err -RedirectStandardOutput server.out
            $procs += $p
            Wait-Url 'http://127.0.0.1:18085/health' 60 'lightfs server'

            # ---- [3] mount as drive Q: through the WinFsp adapter ----
            $mount = Start-Process -FilePath .\bin\lightfs.exe `
              -ArgumentList 'mount','--config',"$PWD\cfg.toml",'Q:' `
              -PassThru -RedirectStandardError mount.err -RedirectStandardOutput mount.out
            $mount.Id | Set-Content mount.pid
            $ok = $false
            foreach ($i in 1..120) {
              if (Test-Path 'Q:\') { $ok = $true; break }
              if ($mount.HasExited) {
                Get-Content mount.err -ErrorAction SilentlyContinue
                throw "mount process exited early (code $($mount.ExitCode))"
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) {
              Get-Content mount.err -ErrorAction SilentlyContinue
              throw "drive Q: never appeared"
            }
            "MOUNTED"

            # ---- [4] roundtrip through the drive ----
            $shellbin = ".\bin\lightfs-shell.exe"
            $srv = "--server","http://127.0.0.1:18085"

            # [4.1] text file: create through the drive, read through the drive
            New-Item -ItemType Directory Q:\docs -Force | Out-Null
            Set-Content Q:\docs\a.txt -NoNewline 'hello lightfs'
            $raw = Get-Content Q:\docs\a.txt -Raw
            if ($raw -ne 'hello lightfs') {
              "DIAG-T: len=$($raw.Length) hex=$([BitConverter]::ToString([Text.Encoding]::UTF8.GetBytes($raw)))"
              throw "text roundtrip"
            }

            # [4.2] random binaries through the drive, byte-exact by hash.
            # Two sizes: 64KB (a single cache-manager page) and 5MB (80
            # pages, multi-chunk write path). On mismatch, locate the first
            # differing 64KB block (block-hash bisect), then the first
            # differing byte inside it - distinguishes lost-chunk zero-fill
            # from misplaced data.
            foreach ($sz in 64KB, 5MB) {
              $b = New-Object byte[] ($sz)
              (New-Object Random 42).NextBytes($b)
              [IO.File]::WriteAllBytes("$PWD\expect.bin", $b)
              $dst = "Q:\docs\rand-$($sz).bin"
              [IO.File]::Copy("$PWD\expect.bin", $dst)
              $h1 = (Get-FileHash "$PWD\expect.bin" -Algorithm SHA256).Hash
              # Plain close (no FlushFileBuffers) has an async commit window
              # in the WinFsp FUSE layer: flush/release run in the Close
              # callback, AFTER CloseHandle returns. Retry the read hash a
              # few times; the flush(true) path below must NOT need this.
              $h2 = $null
              foreach ($try in 1..30) {
                $h2 = (Get-FileHash $dst -Algorithm SHA256).Hash
                if ($h2 -eq $h1) { break }
                Start-Sleep -Milliseconds 500
              }
              if ($h1 -ne $h2) {
                $got = [IO.File]::ReadAllBytes($dst)
                "DIAG: size want=$($b.Length) got=$($got.Length)"
                $block = 64KB
                $bad = -1
                for ($off = 0; $off -lt [Math]::Min($b.Length, $got.Length); $off += $block) {
                  $len = [Math]::Min($block, $b.Length - $off)
                  $sa = New-Object Security.Cryptography.SHA256Managed
                  $ha = ($sa.ComputeHash($b, $off, $len) | ForEach-Object { $_.ToString('x2') }) -join ''
                  $hb = ($sa.ComputeHash($got, $off, $len) | ForEach-Object { $_.ToString('x2') }) -join ''
                  $sa.Dispose()
                  if ($ha -ne $hb) { $bad = $off; break }
                }
                if ($bad -ge 0) {
                  for ($i = $bad; $i -lt [Math]::Min($bad + $block, $b.Length); $i++) {
                    if ($b[$i] -ne $got[$i]) {
                      "DIAG: first diff at offset ${i}: want $($b[$i]) got $($got[$i])"
                      break
                    }
                  }
                } else {
                  "DIAG: all present blocks identical (length tail only)"
                }
                throw "binary roundtrip hash mismatch (size $sz)"
              }
            }

            # [4.2b] strict close-open coherence via FlushFileBuffers:
            # our cb_flush commits synchronously, so a read right after
            # flush(true) must be byte-exact with NO retry.
            $sb = New-Object byte[] (1MB)
            (New-Object Random 7).NextBytes($sb)
            [IO.File]::WriteAllBytes("$PWD\flushin.bin", $sb)
            $fs = [IO.File]::Open('Q:\docs\flushed.bin', 'Create', 'Write')
            $fs.Write($sb, 0, $sb.Length)
            $fs.Flush($true)
            $fs.Close()
            $hf1 = (Get-FileHash "$PWD\flushin.bin" -Algorithm SHA256).Hash
            $hf2 = (Get-FileHash 'Q:\docs\flushed.bin' -Algorithm SHA256).Hash
            if ($hf1 -ne $hf2) { throw "FlushFileBuffers coherence failed" }

            # [4.3] shell client sees the same namespace (server mode)
            $seen = & $shellbin --config "$PWD\cfg.toml" @srv ls /docs
            if (-not ($seen -match 'rand.bin')) { throw "shell ls misses rand.bin: $seen" }
            $cat = (& $shellbin --config "$PWD\cfg.toml" @srv cat /docs/a.txt) -join ""
            if ($cat -ne 'hello lightfs') { throw "shell cat mismatch: '$cat'" }

            # [4.4] append + read back (write-back buffer path)
            Add-Content Q:\docs\a.txt -NoNewline '-more'
            if ((Get-Content Q:\docs\a.txt -Raw) -ne 'hello lightfs-more') { throw "append roundtrip" }

            # [4.5] rename through the drive
            Move-Item Q:\docs\a.txt Q:\docs\renamed.txt
            if ((Test-Path Q:\docs\a.txt) -or -not (Test-Path Q:\docs\renamed.txt)) { throw "rename" }

            # [4.6] listing shows both entries
            $items = @(Get-ChildItem Q:\docs)
            if ($items.Count -lt 2) { throw "dir listing too small" }

            # [4.7] delete through the drive, gone from the shell too
            Remove-Item Q:\docs\renamed.txt
            if (Test-Path Q:\docs\renamed.txt) { throw "delete" }
            & $shellbin --config "$PWD\cfg.toml" @srv stat /docs/renamed.txt 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "deleted file still visible to shell" }

            "ROUNDTRIP OK"

            # ---- [5] kill mount process -> drive must disappear ----
            Stop-Process -Id $mount.Id -Force
            $ok = $false
            foreach ($i in 1..60) {
              if (-not (Test-Path 'Q:\')) { $ok = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) { throw "drive Q: still present after mount process kill" }
            "UNMOUNT OK"
          }
          finally {
            foreach ($p in $procs) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path mount.pid) { Stop-Process -Id (Get-Content mount.pid) -Force -ErrorAction SilentlyContinue }
          }

      - name: Dump logs on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in 'mount.err','server.err','minio.err') {
            if (Test-Path $f) { "===== $f ====="; Get-Content $f }
          }
