# Windows CI: build portable executables on windows-latest, then run a REAL
# mount smoke test through WinFsp (rclone-style: the hosted runner installs
# the WinFsp driver and mounts a drive letter).
#
# Product note (2026-10): the core is one platform-independent codebase; the
# mount layer is OS-specific (Linux FUSE / WinFsp adapter).
name: windows-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Build release binaries
        run: cargo build --release --bin lightfs --bin lightfs-shell --bin lightfs-accept

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: lightfs-windows-x64
          path: |
            target/release/lightfs.exe
            target/release/lightfs-shell.exe
            target/release/lightfs-accept.exe
          retention-days: 7

  mount-smoke:
    # Windows EXPERIMENTAL ADAPTER ACCEPTANCE (not production acceptance):
    # the cross-platform suite (lightfs-accept, same binary the Linux FUSE
    # gate runs) owns the server/mount lifecycles and every byte-exact
    # assertion - write-back boundaries, flush failure injection, plain-
    # close eventual visibility (measured), crash persistence, offline
    # fsck. One step: the Windows runner tears down step-local processes
    # at step end (Job Object cleanup).
    runs-on: windows-latest
    needs: windows
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: lightfs-windows-x64
          path: bin

      - name: Install WinFsp (driver + FUSE-compat DLL)
        run: choco install winfsp -y --no-progress

      - name: Restore pinned MinIO (cache)
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: |
            minio-src
            minio.exe
          key: minio-RELEASE.2025-10-15T17-29-55Z-windows-amd64-v1

      - name: Check out pinned MinIO source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: RELEASE.2025-10-15T17-29-55Z
          path: minio-src

      - name: Install Go (MinIO build)
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build pinned MinIO from source
        if: steps.minio-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:GOOS='windows'
          cd minio-src
          go build -trimpath -ldflags "-s -w" -o ..\minio.exe .

      - name: "Run acceptance suite (single step: servers must outlive step-local cleanup)"
        shell: pwsh
        env:
          GATE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path += ";C:\Program Files (x86)\WinFsp\bin"
          New-Item -ItemType Directory -Force D:\minio-data, D:\lightfs-accept | Out-Null
          @"
          mode = "server"
          [s3]
          endpoint = "http://127.0.0.1:9000"
          region = "us-east-1"
          bucket = "lightfs-accept"
          access_key = "minioadmin"
          secret_key = "minioadmin"
          path_style = true
          [metadata]
          path = "D:/lightfs-accept/metadata.db"
          [server]
          bind = "127.0.0.1:18087"
          [cache.metadata]
          enabled = false
          [cache.data]
          enabled = false
          "@ | Set-Content -Encoding ascii D:\lightfs-accept\cfg.toml
          # MinIO must outlive the suite's own server/mount children, so it
          # is started here and reaped in the finally block below.
          $minio = Start-Process -FilePath .\minio.exe `
            -ArgumentList 'server','D:\minio-data','--address',':9000' -PassThru `
            -RedirectStandardError D:\lightfs-accept\minio.err `
            -RedirectStandardOutput D:\lightfs-accept\minio.out
          # the suite's server pings MinIO at startup - it must be up first
          $ok = $false
          foreach ($i in 1..60) {
            try {
              Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 `
                http://127.0.0.1:9000/minio/health/live | Out-Null
              $ok = $true; break
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) {
            Get-Content D:\lightfs-accept\minio.err -ErrorAction SilentlyContinue
            throw "MinIO did not become healthy"
          }
          .\bin\lightfs.exe create-bucket --config D:\lightfs-accept\cfg.toml
          try {
            # --section takes ONE comma-separated list (each flag REPLACES the
            # set, it does not accumulate). cmd-level redirection keeps the
            # suite output on disk even when the step log itself is not
            # readable: the failure dump step republishes its tail as error
            # annotations, which the checks API serves anonymously.
            cmd /c ".\bin\lightfs-accept.exe --lightfs .\bin\lightfs.exe --shell .\bin\lightfs-shell.exe --config D:\lightfs-accept\cfg.toml --mount-target R: --section a,b,c,w > D:\lightfs-accept\accept.out 2>&1"
            Write-Output "lightfs-accept exit code: $LASTEXITCODE"
            Get-Content D:\lightfs-accept\accept.out -Tail 15 -ErrorAction SilentlyContinue
            # The W-section INFO observations (delete-pending vs sharing,
            # reserved names, symlink stubs) are E3 capability-matrix
            # evidence. Step logs need auth; notice annotations do not.
            $wlines = @(Get-Content D:\lightfs-accept\accept.out -Tail 40 -ErrorAction SilentlyContinue |
              ForEach-Object { $_ -replace '%', '%25' })
            if ($wlines.Count -gt 0) {
              $body = $wlines -join '%0A'
              if ($body.Length -gt 3500) { $body = '...' + $body.Substring($body.Length - 3500) }
              Write-Output "::notice file=accept.out::$body"
            }
            exit $LASTEXITCODE
          }
          finally {
            if (Get-Process -Id $minio.Id -ErrorAction SilentlyContinue) {
              Stop-Process -Id $minio.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Dump child stderr on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in 'D:\lightfs-accept\mount.err','D:\lightfs-accept\server.err','D:\lightfs-accept\minio.err') {
            if (Test-Path $f) { "===== $f ====="; Get-Content $f }
          }
          # Republish tails as error annotations: the checks API serves them
          # anonymously, unlike step logs / artifacts (both need auth).
          function Emit([string]$name, [string]$path, [int]$tail) {
            if (-not (Test-Path $path)) { Write-Output "::error file=$name::(missing)"; return }
            $lines = @(Get-Content $path -Tail $tail -ErrorAction SilentlyContinue |
              ForEach-Object { $_ -replace '%', '%25' })
            if ($lines.Count -eq 0) { Write-Output "::error file=$name::(empty)"; return }
            $body = $lines -join '%0A'
            if ($body.Length -gt 3000) { $body = '...' + $body.Substring($body.Length - 3000) }
            Write-Output "::error file=$name::$body"
          }
          Emit 'accept.out' 'D:\lightfs-accept\accept.out' 60
          Emit 'mount.err' 'D:\lightfs-accept\mount.err' 30
          Emit 'server.err' 'D:\lightfs-accept\server.err' 30
          Emit 'minio.err' 'D:\lightfs-accept\minio.err' 15

      - name: Upload acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-log
          path: D:\lightfs-accept\*.err
          retention-days: 30
