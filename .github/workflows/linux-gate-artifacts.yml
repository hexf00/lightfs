# fuse-acceptance task line: dispatch-only Linux x86_64 build producing the
# three binaries the ECS-native FUSE acceptance needs (lightfs server/mount,
# lightfs-shell for the C3b cross-check, lightfs-accept runner).
#
# This is BUILD infrastructure for the gate environment, not a test entry:
# acceptance verdicts come from lightfs-accept driving real FUSE mounts on
# the ECS host. The BINARIES.sha file inside the artifact pins the exact
# source SHA and binary hashes, so "the binary was built from the verified
# source" is checkable on the target host.
name: linux-gate-artifacts

on:
  # push-scoped to this task branch: a workflow that exists only on a
  # non-default branch is not dispatchable until it has run once, and the
  # fix loop wants an artifact per push anyway.
  push:
    branches: [fuse-acceptance]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain is pinned by rust-toolchain.toml; rustup picks it up.
      # MUSL STATIC: the gate host is CentOS 7 (glibc 2.17) — glibc builds
      # from the ubuntu runner (2.39) fail with GLIBC_x.y not found. A
      # static musl binary has no host-libc dependency at all.
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries (x86_64-unknown-linux-musl)
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl \
            --bin lightfs --bin lightfs-shell --bin lightfs-accept

      - name: Pin built SHA + binary hashes
        run: |
          {
            echo "source-sha $(git rev-parse HEAD)"
            sha256sum target/x86_64-unknown-linux-musl/release/lightfs \
                      target/x86_64-unknown-linux-musl/release/lightfs-shell \
                      target/x86_64-unknown-linux-musl/release/lightfs-accept
          } > BINARIES.sha
          cat BINARIES.sha

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-${{ github.sha }}
          path: |
            target/x86_64-unknown-linux-musl/release/lightfs
            target/x86_64-unknown-linux-musl/release/lightfs-shell
            target/x86_64-unknown-linux-musl/release/lightfs-accept
            BINARIES.sha
          retention-days: 14
